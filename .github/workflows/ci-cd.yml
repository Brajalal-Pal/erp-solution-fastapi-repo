name: CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          pytest

      - name: Run lint
        run: |
          ruff check .


  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest

    needs:
      - test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t erp-solution-fastapi-repo:${{ github.sha }} \
            .

      - name: Show Docker image
        run: |
          docker images
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: erp-solution-fastapi-repo:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH