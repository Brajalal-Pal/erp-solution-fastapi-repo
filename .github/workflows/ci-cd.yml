name: CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read
  
jobs:

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          pytest

      - name: Run lint
        run: |
          ruff check .


  docker:
    name: Build, Scan and Push Docker Image
    runs-on: ubuntu-latest

    needs:
      - test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t erp-solution-fastapi-repo:${{ github.sha }} \
            .

      - name: Show Docker image
        run: |
          docker images
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: erp-solution-fastapi-repo:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      # - name: Debug GitHub OIDC
      #   uses: github/actions-oidc-debugger@main


      - name: Inspect GitHub OIDC claims
        shell: bash
        run: |
          set -e

          TOKEN_RESPONSE=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.value')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Failed to obtain GitHub OIDC token"
            exit 1
          fi

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2)

          # Add padding required by base64
          case $((${#PAYLOAD} % 4)) in
            2) PAYLOAD="${PAYLOAD}==" ;;
            3) PAYLOAD="${PAYLOAD}=" ;;
          esac

          echo "OIDC claims:"
          echo "$PAYLOAD" | base64 -d | jq '{aud, sub, repository, repository_owner, ref}'


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ap-south-1
          role-to-assume: arn:aws:iam::251355111970:role/GitHubActionsECRPushRole


      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ------------------------------------------------------------------------------------------------------
      # Tag Docker Image
      # ------------------------------------------------------------------------------------------------------
      - name: Tag Docker image
        run: |
          docker tag \
            erp-solution-fastapi-repo:${{ github.sha }} \
            ${{ steps.login-ecr.outputs.registry }}/erp-solution-fastapi-repo:${{ github.sha }}

      
      # ------------------------------------------------------------------------------------------------------
      # Push Docker image to ECR
      # ------------------------------------------------------------------------------------------------------
      - name: Push Docker image to ECR
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/erp-solution-fastapi-repo:${{ github.sha }}

      